name: publish-intelligence
on:
  push:
    branches: [main]
    paths: ["scripts/**", "source-publication.json", ".github/workflows/publish-intelligence.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dedicated-intelligence-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/toolkit/intelligence:${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/checkout@v4
        with:
          repository: bartimoussmith-oss/civic-newsroom
          ref: 18efc5218131792fb311493d4678b700c4d8d71a
          path: toolkit
          persist-credentials: false
          sparse-checkout: intelligence
      - uses: actions/checkout@v4
        with:
          repository: bartimoussmith-oss/civic-newsroom-data-001
          ref: 2465245db04551c42f748a85fc151b869d246649
          path: source-data
          persist-credentials: false
          sparse-checkout: datasets/build-40279333802
      - name: Restore pinned publication descriptor locally
        run: cp source-publication.json source-data/published.json
      - name: Test engine, reconstruction and dedicated-host guards
        id: tests
        run: |
          python -m unittest discover -s toolkit/intelligence -p 'test_*.py' -v
          python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build and verify all pinned source representations
        id: build
        run: python scripts/host_build.py build --dataset-repo source-data --out /tmp/host-intelligence > host-build-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            host-build-result.json
            /tmp/host-intelligence/public/collection.json
          retention-days: 7
      - name: Publish immutable generation and data pointer
        id: publication
        run: python scripts/host_build.py publish --out /tmp/host-intelligence
      - name: Record data publication status
        if: always()
        uses: actions/github-script@v7
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          PUBLICATION_RESULT: ${{ steps.publication.outcome }}
        with:
          script: |
            const owner='bartimoussmith-oss',repo='civic-newsroom-intelligence-001';
            let publication=null;
            if(process.env.PUBLICATION_RESULT==='success'){const p=await github.rest.repos.getContent({owner,repo,path:'intelligence-publication.json',ref:'main'});publication=JSON.parse(Buffer.from(p.data.content,'base64').toString('utf8'));}
            const report={schema:'intelligence-host-status-v1',run_id:context.runId,builder_revision:context.sha,tests:process.env.TEST_RESULT,build:process.env.BUILD_RESULT,publication_result:process.env.PUBLICATION_RESULT,publication,checked_at:new Date().toISOString(),scope:'Data publication only; not website deployment, factual validation or Google indexing.'};
            const path='status/build.json';let old;try{old=await github.rest.repos.getContent({owner,repo,path,ref:'main'});}catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'status: dedicated intelligence build '+context.runId,content:Buffer.from(JSON.stringify(report,null,2)).toString('base64'),...(old?{sha:old.data.sha}:{})});
